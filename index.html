<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM ibis Styles Armenia - Base de datos (clientes potenciales)</title>
<style>
  :root { --azul:#1f3864; --azul2:#2e5aa8; --claro:#eef3fb; --gris:#f5f6f8; --linea:#d9dee7; --verde:#1e7d46; --ambar:#9a6b00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, Roboto, Arial, sans-serif; color:#1c2330; background:var(--gris); }
  header { background:linear-gradient(135deg,var(--azul),var(--azul2)); color:#fff; padding:14px 22px; }
  header h1 { margin:0; font-size:19px; }
  header p { margin:4px 0 0; font-size:12.5px; opacity:.9; }
  .badges { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .badge { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); padding:2px 10px; border-radius:99px; font-size:11.5px; }
  .layout { display:flex; min-height:calc(100vh - 86px); }
  aside { width:272px; flex:0 0 272px; background:#fff; border-right:1px solid var(--linea); padding:10px 0 40px; overflow-y:auto; max-height:calc(100vh - 86px); position:sticky; top:0; }
  aside .group { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#7a8699; padding:14px 16px 6px; }
  aside a.item { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 16px; font-size:13.5px; color:#28324a; text-decoration:none; border-left:3px solid transparent; cursor:pointer; }
  aside a.item:hover { background:var(--claro); }
  aside a.item.active { background:var(--claro); border-left-color:var(--azul2); font-weight:600; }
  aside .cnt { background:#e8ecf4; color:#4a5670; font-size:11px; padding:1px 8px; border-radius:99px; }
  main { flex:1; padding:18px 22px 46px; min-width:0; }
  .card { background:#fff; border:1px solid var(--linea); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  h2 { margin:0 0 4px; font-size:17px; color:var(--azul); }
  .sub { font-size:12.5px; color:#66708a; margin-bottom:12px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .toolbar input { flex:1; min-width:200px; padding:8px 12px; border:1px solid var(--linea); border-radius:8px; font-size:13.5px; }
  .toolbar .n { font-size:12.5px; color:#66708a; white-space:nowrap; }
  button { background:var(--azul2); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button:hover { background:var(--azul); }
  .tablewrap { overflow:auto; max-height:calc(100vh - 300px); border:1px solid var(--linea); border-radius:10px; background:#fff; }
  table { border-collapse:collapse; width:100%; font-size:12.8px; }
  th { position:sticky; top:0; background:var(--azul); color:#fff; text-align:left; padding:8px 10px; font-weight:600; white-space:nowrap; cursor:pointer; z-index:2; }
  th .dir { opacity:.75; font-size:10px; }
  td { padding:6px 10px; border-top:1px solid #eef0f4; white-space:nowrap; }
  tr:nth-child(even) td { background:#fafbfd; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .empty { padding:26px; text-align:center; color:#7a8699; }
  .kpigrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .kpi { background:#fff; border:1px solid var(--linea); border-radius:10px; padding:14px 16px; }
  .kpi .k { font-size:12px; color:#66708a; min-height:30px; }
  .kpi .v { font-size:26px; font-weight:700; color:var(--azul); margin:6px 0 2px; }
  .kpi .m { font-size:11.5px; color:#7a8699; }
  .chip { display:inline-block; font-size:11px; padding:2px 9px; border-radius:99px; margin-top:6px; }
  .chip.ok { background:#e3f4e8; color:var(--verde); }
  .chip.mx { background:#fdf3dc; color:var(--ambar); }
  .chip.inf { background:#e8ecf4; color:#4a5670; }
  .bars .row { display:grid; grid-template-columns:190px 60px 1fr; align-items:center; gap:10px; margin:7px 0; font-size:13px; }
  .bars .b { background:linear-gradient(90deg,var(--azul2),#7ea4e0); height:20px; border-radius:5px; min-width:3px; }
  .bars .meta { font-size:11.5px; color:#7a8699; }
  .files { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px; }
  .file { background:#fff; border:1px solid var(--linea); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .file .fn { font-weight:600; font-size:13.5px; word-break:break-all; }
  .file .fd { font-size:12px; color:#66708a; flex:1; }
  .file .fs { font-size:11.5px; color:#7a8699; }
  footer { color:#7a8699; font-size:11.5px; margin-top:18px; }
  .note { background:#fdf3dc; border:1px solid #f0dfae; color:#6b5300; font-size:12.5px; border-radius:8px; padding:9px 12px; margin-bottom:14px; }
  .cliente-detail { display:none; background:#fff; border:1px solid var(--linea); border-radius:10px; padding:20px; margin-top:16px; }
  .cliente-detail h3 { margin:0 0 12px; color:var(--azul); font-size:18px; }
  .detalle-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin-bottom:16px; }
  .detalle-row { background:#fafbfd; border:1px solid var(--linea); border-radius:8px; padding:10px 14px; }
  .detalle-row .lbl { font-size:11px; color:#7a8699; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; display:block; }
  .detalle-row .val { font-size:14px; color:#1c2330; font-weight:500; }
  .detalle-row .val.num { color:#2e5aa8; }
  .detalle-actions { display:flex; gap:10px; margin-top:16px; }
  .detalle-actions button { background:var(--azul2); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:13px; cursor:pointer; flex:1; }
  .detalle-actions button:hover { background:var(--azul); }
  .detalle-actions button.secondary { background:#fff; color:var(--azul2); border:1px solid var(--linea); }
  .detalle-actions button.secondary:hover { background:var(--claro); }
  table tr.cliente-row { cursor:pointer; }
  table tr.cliente-row:hover { background:#eef3fb !important; }
</style>
</head>

  const horizonte = get('horizonte');
  const experiencia = get('experiencia_inmuebles');
  const idCanal = get('id_canal');
  const idCampana = get('id_campana');

  const segmento = getLookup('segmento', 'id_segmento', 'nombre', idSegmento);
  const rango = getLookup('rango_inversion', 'id_rango', 'nombre', idRango);
  const canal = getLookup('canal', 'id_canal', 'nombre', idCanal);
  const campana = getLookup('campana', 'id_campana', 'nombre', idCampana);
  const asesor = getLookup('asesor', 'id_asesor', 'nombre', idAsesor);
  const etapa = getLookup('etapa', 'id_etapa', 'nombre', idEtapa);

  const interacciones = DATA.tables.find(x => x.name === 'interaccion');
  let intHtml = '<p class="sub">Sin interacciones registradas.</p>';
  if (interacciones) {
    const ii = interacciones.cols.indexOf('id_cliente');
    const rows = interacciones.rows.filter(r => r[ii] == idCliente);
    if (rows.length) {
      intHtml = '<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Observaci\u00f3n</th></tr></thead><tbody>';
      rows.forEach(r => {
        const fechaIdx = interacciones.cols.indexOf('fecha');
        const tipoIdx = interacciones.cols.indexOf('id_tipo');
        const obsIdx = interacciones.cols.indexOf('observaciones');
        const tipoNombre = getLookup('tipo_interaccion', 'id_tipo', 'nombre', r[tipoIdx]);
        intHtml += '<tr><td>' + esc(fmt(r[fechaIdx])) + '</td><td>' + esc(tipoNombre) + '</td><td>' + esc(r[obsIdx] || '\u2014') + '</td></tr>';
      });
      intHtml += '</tbody></table>';
    }
  }

  const auth = DATA.tables.find(x => x.name === 'autorizacion_datos');
  let authHtml = '<p class="sub">Sin registro de autorizaci\u00f3n.</p>';
  if (auth) {
    const ai = auth.cols.indexOf('id_cliente');
    const arow = auth.rows.find(r => r[ai] == idCliente);
    if (arow) {
      const fechaIdx = auth.cols.indexOf('fecha');
      const medioIdx = auth.cols.indexOf('medio');
      const vigenteIdx = auth.cols.indexOf('vigente');
      authHtml = '<div class="detalle-row"><span class="lbl">Fecha autorizaci\u00f3n</span><span class="val">' + esc(fmt(arow[fechaIdx])) + '</span></div>' +
        '<div class="detalle-row"><span class="lbl">Medio</span><span class="val">' + esc(arow[medioIdx] || '\u2014') + '</span></div>' +
        '<div class="detalle-row"><span class="lbl">Vigente (Ley 1581)</span><span class="val">' + (arow[vigenteIdx] == 1 ? 'S\u00ed' : 'No') + '</span></div>';
    }
  }
    }
  }

  const detalle = document.createElement('div');
  detalle.className = 'cliente-detail';
  detalle.innerHTML = '<h3>' + esc(nombres || '') + ' ' + esc(apellidos || '') + '</h3>' +
    '<div class="detalle-grid">' +
    '<div class="detalle-row"><span class="lbl">ID Cliente</span><span class="val num">' + id + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Correo</span><span class="val">' + esc(correo || '\u2014') + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Celular</span><span class="val">' + esc(celular || '\u2014') + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Ciudad</span><span class="val">' + esc(ciudad) + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Segmento</span><span class="val">' + esc(segmento) + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Rango de inversi\u00f3n</span><span class="val">' + esc(rango) + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Horizonte</span><span class="val">' + esc(horizonte || '\u2014') + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Experiencia inmuebles</span><span class="val">' + (experiencia == 1 ? 'S\u00ed' : 'No') + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Canal</span><span class="val">' + esc(canal) + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Campaa\u00f1a</span><span class="val">' + esc(campana) + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Etapa</span><span class="val">' + esc(etapa) + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Asesor</span><span class="val">' + esc(asesor || 'Sin asignar') + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Fecha registro</span><span class="val">' + esc(fechaRegistro || '\u2014') + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Solicit\u00f3 baja</span><span class="val">' + (solicitoBaja == 1 ? 'S\u00ed' : 'No') + '</span></div>' +
    '<div class="detalle-row"><span class="lbl">Referido por</span><span class="val">' + (referidoPor ? 'Cliente #' + referidoPor : '\u2014') + '</span></div>' +
    '</div>' +
    '<div style="margin-top:16px;"><span class="lbl" style="display:block; margin-bottom:8px;">Autorizaci\u00f3n de datos</span>' + authHtml + '</div>' +
    '<div style="margin-top:16px;"><span class="lbl" style="display:block; margin-bottom:8px;">Interacciones</span>' + intHtml + '</div>' +
    '<div class="detalle-actions"><button onclick="cerrarDetalle()">Cerrar</button><button class="secondary" onclick="location.reload()">Refrescar</button></div>';

  const prev = document.getElementById('cliente-detalle-panel');
  if (prev) prev.remove();
  detalle.id = 'cliente-detalle-panel';
  document.getElementById('main').appendChild(detalle);
  detalle.style.display = 'block';
  detalle.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cerrarDetalle() {
  const p = document.getElementById('cliente-detalle-panel');
  if (p) p.style.display = 'none';
}

h += '<div class="group">Principal</div>';
  h += `<a class="item" data-k="__resumen">Resumen y KPIs<span class="cnt">\u2605</span></a>`;
  const cli = DATA.tables.find(t => t.name === 'cliente');
  h += `<a class="item" data-k="cliente">Clientes (leads)<span class="cnt">${cli.rows.length}</span></a>`;
  h += `<a class="item" data-k="__archivos">Archivos para descargar<span class="cnt">${DATA.files.length}</span></a>`;
  h += '<div class="group">Tablas (16)</div>';
  DATA.tables.filter(t => t.kind === 'table' && t.name !== 'cliente').forEach(t => {
    h += `<a class="item" data-k="${t.name}">${esc(t.label)}<span class="cnt">${t.rows.length}</span></a>`;
  });
  h += '<div class="group">Vistas calculadas (10)</div>';
  DATA.tables.filter(t => t.kind === 'view').forEach(t => {
    h += `<a class="item" data-k="${t.name}">${esc(t.label)}<span class="cnt">${t.rows.length}</span></a>`;
  });
  menu.innerHTML = h;
  menu.querySelectorAll('a.item').forEach(a => a.addEventListener('click', () => show(a.dataset.k)));
}

function setActive(k) {
  menu.querySelectorAll('a.item').forEach(a => a.classList.toggle('active', a.dataset.k === k));
}

function show(k) {
  setActive(k);
  if (k === '__resumen') return renderResumen();
  if (k === '__archivos') return renderArchivos();
  currentData = DATA.tables.find(x => x.name === k);
  sortCol = -1; sortDir = 1; filter = '';
  renderTable();
}

function tableHTML(t) {
  const q = filter.trim().toLowerCase();
  let rows = t.rows.map((r, i) => ({ r, i }));
  if (q) rows = rows.filter(x => x.r.join(' ').toLowerCase().includes(q) || x.r.some(v => fmt(v).toLowerCase().includes(q)));
  if (sortCol >= 0) {
    rows.sort((a, b) => {
      const x = a.r[sortCol], y = b.r[sortCol];
      if (x === null) return 1; if (y === null) return -1;
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * sortDir;
      return String(x).localeCompare(String(y), 'es') * sortDir;
    });
  }
  let h = '<div class="toolbar">';
  h += `<input id="q" placeholder="Buscar en ${t.rows.length} filas\u2026" value="${esc(filter)}">`;
  h += `<span class="n" id="cntN">${rows.length} de ${t.rows.length} filas</span>`;
  h += `<button id="csv">Descargar CSV</button></div>`;
  h += `<div class="tablewrap"><table><thead><tr>`;
  t.cols.forEach((c, j) => {
    const dir = sortCol === j ? (sortDir === 1 ? ' \u25B2' : ' \u25BC') : '';
    h += `<th data-j="${j}">${esc(c)}<span class="dir">${dir}</span></th>`;
  });
  if (t.name === 'cliente') h += '<th>WhatsApp</th>';
  h += '</tr></thead><tbody>';
  if (!rows.length) h += `<tr><td class="empty" colspan="${t.cols.length + (t.name === 'cliente' ? 1 : 0)}">Sin resultados para la busqueda</td></tr>`;
  rows.slice(0, 500).forEach(x => {
    const idCliente = t.name === 'cliente' ? x.r[0] : null;
    h += `<tr${idCliente ? ' class="cliente-row" onclick="verDetalleCliente(' + idCliente + ')"' : ''}>`;
    x.r.forEach(v => {
      const num = typeof v === 'number' ? ' class="num"' : '';
      h += `<td${num}>${esc(fmt(v))}</td>`;
    });
    if (t.name === 'cliente') {
      const nm = encodeURIComponent('Hola ' + (x.r[1] || '') + ', hablas con Laura de Construcciones Buen Vivir. Gracias por inscribirte. Para darte mas detalles, como prefieres que te contacte?');
      h += `<td><a class="wabtn" href="https://wa.me/573138512682?text=${nm}" target="_blank" rel="noopener">WhatsApp</a></td>`;
    }
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if (rows.length > 500) h += `<p class="sub">Mostrando las primeras 500 filas de ${rows.length}. Usa la busqueda o descarga el CSV para ver todas.</p>`;
  return h;
}

function renderTable() {
  const t = currentData;
  main.innerHTML = `<div class="card"><h2>${esc(t.label)}</h2>
    <div class="sub">Tabla/vista \u00ab${t.name}\u00bb &middot; ${t.cols.length} columnas &middot; ${t.rows.length} filas</div>
    ${t.kind === 'view' ? '<div class="note">Vista calculada: el resultado se recalcula automaticamente con los datos de las tablas.</div>' : ''}
    ${t.name === 'cliente' ? '<div class="card"><h2>Buscador rapido de clientes</h2><div class="toolbar"><input id="q2" placeholder="Escribe nombre, apellido, correo o celular\u2026"><span class="n" id="cnt2"></span></div><div id="resGrid2"></div></div>' : ''}
    <div id="grid"></div></div>`;
  document.getElementById('grid').innerHTML = tableHTML(t);
  const q2 = document.getElementById('q2');
  if (q2) {
    const tc = t;
    function run2() {
      const q = (q2.value || '').trim().toLowerCase();
      const rows = !q ? [] : tc.rows.filter(r => (r.join(' ')).toLowerCase().includes(q) || r.some(v => String(v === null ? '' : v).toLowerCase().includes(q))).slice(0, 50);
      const g = document.getElementById('resGrid2');
      if (!q) { g.innerHTML = '<p class="sub">Escribe para buscar.</p>'; document.getElementById('cnt2').textContent = ''; return; }
      document.getElementById('cnt2').textContent = rows.length + ' resultados';
      let hh = '<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Celular</th></tr></thead><tbody>';
      if (!rows.length) hh += '<tr><td class="empty" colspan="4">Sin resultados</td></tr>';
      rows.forEach(r => { hh += '<tr><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td><td>' + esc(r[4]) + '</td></tr>'; });
      hh += '</tbody></table></div>';
      g.innerHTML = hh;
    }
    q2.addEventListener('input', run2);
  }
  document.getElementById('q').addEventListener('input', e => {
    filter = e.target.value;
    document.getElementById('grid').innerHTML = tableHTML(t);
    document.getElementById('q').focus();
  });
  document.querySelectorAll('th[data-j]').forEach(th => th.addEventListener('click', () => {
    const j = +th.dataset.j;
    if (sortCol === j) sortDir = -sortDir; else { sortCol = j; sortDir = 1; }
    document.getElementById('grid').innerHTML = tableHTML(t);
  }));
  document.getElementById('csv').addEventListener('click', () => {
    const q = filter.trim().toLowerCase();
    let rows = t.rows.filter(r => !q || r.some(v => fmt(v).toLowerCase().includes(q)));
    const csv = [t.cols.join(';')].concat(rows.map(r => r.map(v => fmt(v).replace(/;/g, ',')).join(';'))).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = t.name + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

function renderResumen() {
  let h = '<div class="card"><h2>Resumen del negocio (base de ejemplo)</h2><div class="sub">KPIs calculados por la vista v_kpis contra las metas del plan de marketing.</div><div class="kpigrid">';
  DATA.kpis.forEach(k => {
    const [name, valor, meta] = k;
    const pct = /onversi|eferidos|utoriz/.test(name) && valor <= 1.001;
    const val = pct ? (valor * 100).toFixed(1).replace('.', ',') + ' %'
                    : (Number.isInteger(valor) ? valor.toLocaleString('es-CO') : String(valor).replace('.', ','));
    let chip = '<span class="chip inf">Informativo</span>';
    if (meta !== null && meta !== undefined) {
      chip = valor >= meta ? '<span class="chip ok">Cumple meta</span>'
                           : '<span class="chip mx">Muestra: meta del plan ' + fmt(meta) + '</span>';
    }
    h += `<div class="kpi"><div class="k">${esc(name)}</div><div class="v">${val}</div><div class="m">${meta === null || meta === undefined ? 'sin meta' : 'meta: ' + fmt(meta)}</div>${chip}</div>`;
  });
  h += '</div></div>';
  h += '<div class="card"><h2>Embudo de ventas</h2><div class="sub">Leads que llegaron a cada etapa (vista v_embudo).</div><div class="bars">';
  const max = Math.max(...DATA.embudo.map(r => r[2]));
  DATA.embudo.forEach(r => {
    const w = Math.max(r[2] / max * 100, 1.5);
    h += `<div class="row"><span>${esc(r[1])}</span><b>${fmt(r[2])}</b><div><div class="b" style="width:${w}%"></div>${r[3] !== null ? `<span class="meta">conversion real ${(r[3]*100).toFixed(1)} % vs meta ${(r[4]*100).toFixed(0)} %</span>` : ''}</div></div>`;
  });
  h += '</div></div>';
  h += '<div class="card"><h2>Clasificacion de la base</h2><div class="sub">Puntaje de leads: caliente \u2265 70, tibio \u2265 40 (vista v_clasificacion_resumen).</div><div class="kpigrid">';
  DATA.clasif.forEach(c => {
    h += `<div class="kpi"><div class="k">${esc(c[0])}</div><div class="v">${fmt(c[1])}</div><div class="m">${(c[2]*100).toFixed(1)} % de la base</div></div>`;
  });
  h += '</div></div>';
  h += '</div></div>';
  h += '<div class="card"><h2>Buscador de clientes (lead)</h2><div class="sub">Escribe un nombre y filtra la base de clientes.</div>';
  h += '<div class="toolbar"><input id="qres" placeholder="Buscar por nombre, apellido, correo o celular\u2026" value=""><span class="n" id="cntRes"></span></div>';
  h += '<div id="resGrid"></div></div>';
  main.innerHTML = h;
  const tc = DATA.tables.find(x => x.name === 'cliente');
  function runRes() {
    const q = (document.getElementById('qres').value || '').trim().toLowerCase();
    const rows = !q ? [] : tc.rows.filter(r => (r.join(' ')).toLowerCase().includes(q) || r.some(v => String(v === null ? '' : v).toLowerCase().includes(q))).slice(0, 50);
    const grid = document.getElementById('resGrid');
    if (!q) { grid.innerHTML = '<p class="sub">Escribe para buscar.</p>'; document.getElementById('cntRes').textContent = ''; return; }
    document.getElementById('cntRes').textContent = rows.length + ' resultados';
    let hh = '<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Celular</th></tr></thead><tbody>';
    if (!rows.length) hh += '<tr><td class="empty" colspan="4">Sin resultados</td></tr>';
    rows.forEach(r => { hh += '<tr><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td><td>' + esc(r[4]) + '</td></tr>'; });
    hh += '</tbody></table></div>';
    grid.innerHTML = hh;
  }
  document.getElementById('qres').addEventListener('input', runRes);
}

function renderArchivos() {
  let h = '<div class="card"><h2>Archivos del trabajo</h2><div class="sub">Descarga aqui los archivos originales de la entrega (se descargan desde esta misma pagina).</div><div class="files">';
  DATA.files.forEach((f, i) => {
    h += `<div class="file"><div class="fn">${esc(f.name)}</div><div class="fd">${esc(f.desc)}</div><div class="fs">${filesize(f.size)}</div><button data-f="${i}">Descargar</button></div>`;
  });
  h += '</div></div><footer>Base de datos de muestra con datos ficticios. Ver la Nota metodologica incluida en las descargas.</footer>';
  main.innerHTML = h;
  document.querySelectorAll('button[data-f]').forEach(b => b.addEventListener('click', () => {
    const f = DATA.files[+b.dataset.f];
    const bin = atob(f.b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = f.name;
    a.click();
    URL.revokeObjectURL(a.href);
  }));
}

buildMenu();
show('__resumen');
</script>
